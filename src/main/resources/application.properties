spring.application.name=numerador
server.servlet.context-path=/numerador

# SWAGGER
springdoc.swagger-ui.path=/docs
springdoc.packagesToScan=br.gov.ce.cgd.restcontroller

# JWT
jwt.secret=4F9A71468C87EFA34F9189C6F1A1A76A4A0F9F7A8C6D1E5F9B3C7D8EAF1B2C3D
jwt.expiration=3600000

# TIMEZONE
spring.jpa.properties.hibernate.jdbc.time_zone=America/Fortaleza
spring.jackson.time-zone=America/Fortaleza

# 🔴 SESSÃO DESATIVADA
server.servlet.session.timeout=1s
server.servlet.session.persistent=false
server.servlet.session.cookie.max-age=0
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# Não usar URLs com sessão
server.servlet.session.tracking-modes=COOKIE

# 🔴 THYMELEAF DESATIVADO
spring.thymeleaf.enabled=false
spring.thymeleaf.cache=false
spring.thymeleaf.check-template=false
spring.thymeleaf.check-template-location=false

# LOGGING
logging.level.root=WARN
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.session=OFF
logging.level.org.springframework.security.web.session=OFF
logging.level.org.hibernate.SQL=DEBUG

# DATABASE
spring.datasource.url=jdbc:postgresql://10.10.10.7:5432/CGD_TESTE
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=numerador

# 🔴 FILTROS DE MÉTODO DESATIVADOS
spring.mvc.hiddenmethod.filter.enabled=false

# EMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
