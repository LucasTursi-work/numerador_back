<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="modal-head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/modal-common.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
<!-- aba-usuarios.html -->
<div th:fragment="abaUsuarios" class="table-responsive bg-white p-3 rounded shadow-sm">
  <div style="height: 90vh; width: 87vw; box-sizing: border-box; padding: 1rem;">
  
    <button type="button" class="btn btn-success mb-2"
      onclick="abrirModalCadastrarUsuarios()"
      th:unless="${usuarioPerfil == 'USER'}">
      <i class="bi bi-people-fill me-2"></i> Adicionar
    </button>
    
    <div id="mensagemUsuario" class="alert alert-success" role="alert" style="display:none;"></div>

    <div class="row mt-1 mb-3">
      <div class="col-md-3">
        <label for="filtroNome">Nome:</label>
        <input type="text" id="filtroNome" class="form-control" placeholder="Digite o nome" />
      </div>
      <div class="col-md-3">
        <label for="filtroCPF">CPF:</label>
        <input type="text" id="filtroCPF" class="form-control" placeholder="Digite o CPF" />
      </div>
      <div class="col-md-2">
        <label for="filtroPerfil">Perfil:</label>
        <select id="filtroPerfil" class="form-control">
          <option value="">Todos</option>
          <option value="ADMIN">Admin</option>
          <option value="USER">User</option>
        </select>
      </div>
      <div class="col-md-2">
        <label for="filtroStatus">Status:</label>
        <select id="filtroStatus" class="form-control">
          <option value="">Todos</option>
          <option value="ATIVO">Ativo</option>
          <option value="INATIVO">Inativo</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="d-block invisible">Botão</label>
        <button id="limparFiltros" type="button" class="btn btn-danger">
          <i class="bi bi-trash-fill"></i> Limpar
        </button>
      </div>
    </div>

    <!-- Área com tamanho fixo e rolagem para tabela -->
    <div class="card mb-3 flex-grow-1" style="height: 680px; overflow: hidden;">
      <div class="card-header bg-secondary text-white">
        <h5 class="mb-0">Usuários</h5>
      </div>
      <div style="height: 100%; overflow-y: auto;">
        <table class="table table-striped table-hover"  style="table-layout: fixed; width: 100%;">
          <thead class="table-light" style="position: sticky; top: 0; z-index: 10; background-color: white;">
            <tr style="text-align: center;">
              <th style="width: 20px;">ID</th>
              <th style="width: 180px; text-align: left;">Nome</th>
              <th style="width: 200px; text-align: left;">Email</th>
              <th style="width: 60px;">CPF</th>
              <th style="width: 50px;">Perfil</th>
              <th style="width: 75px;">Data do Cadastro</th>
              <th style="width: 75px;">Último Login</th>
              <th style="width: 50px;">Status</th>
              <th style="width: 60px;">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaUsuarios">
            <tr th:each="usuario : ${usuarios}">
              <td class="text-center" th:text="${usuario.id}"></td>
              <td th:text="${usuario.nome}"></td>
              <td th:text="${usuario.email}"></td>
              <td class="text-center" th:text="${usuario.cpf}"></td>
              <td class="text-center" th:text="${usuario.perfil}"></td>
              <td class="text-center" th:text="${#temporals.format(usuario.dataCadastro, 'dd/MM/yyyy')}"></td>
              <td class="text-center" th:text="${#temporals.format(usuario.dataLogin, 'dd/MM/yyyy HH:mm')}"></td>
              <td class="text-center" th:text="${usuario.status}"></td>
              <td class="action-buttons text-center">
                <button type="button" class="btn btn-success bi bi-pencil-fill btn-sm" th:onclick="'carregarModalEditarUsuario(' + ${usuario.id} + ')'"> Editar</button>
              </td>
            </tr>
          </tbody>
			<script th:src="@{/js/filtrar.js}"></script>
			<script th:src="@{/js/modal.js}"></script>
			<div th:replace="fragments/modal-editar-usuario :: modalEditarUsuario"></div>
        </table>
      </div>
      <div class="d-flex justify-content-center mt-3">
		  <nav aria-label="Page navigation">
		    <ul class="pagination">
		      <li class="page-item disabled">
		        <a class="page-link" href="#" tabindex="-1">Anterior</a>
		      </li>
		      <li class="page-item active"><a class="page-link" href="#">1</a></li>
		      <li class="page-item"><a class="page-link" href="#">2</a></li>
		      <li class="page-item"><a class="page-link" href="#">3</a></li>
		      <li class="page-item">
		        <a class="page-link" href="#">Próximo</a>
		      </li>
		    </ul>
		  </nav>
		</div>
    </div>
  </div>
</div>

</body>
</html>
