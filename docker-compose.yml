version: "3.9"

services:
  db:
    image: postgres:15
    container_name: numerador-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: numerador
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-data/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - numerador-network

  app:
    build: .
    container_name: numerador-app
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/numerador
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: numerador
    ports:
      - "8080:8080"
    networks:
      - numerador-network

  pgadmin:
    image: dpage/pgadmin4:7
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - numerador-network

volumes:
  postgres-data: 
    name: numerador_postgres-data
    external: true


networks:
  numerador-network:
    driver: bridge
